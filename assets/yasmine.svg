  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FDF8EE"/>
    <stop offset="0.55" stop-color="#F5EAD6"/>
    <stop offset="1" stop-color="#EBD9BB"/>
