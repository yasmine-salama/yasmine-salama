  <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7A1F2B"/>
    <stop offset="0.5" stop-color="#C29B55"/>
    <stop offset="1" stop-color="#7A1F2B"/>
  </linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
    <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#7A4A2A" flood-opacity="0.26"/>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7A4A2A" flood-opacity="0.22"/>
  </filter>
  <filter id="blur10" x="-100%" y="-100%" width="300%" height="300%">
