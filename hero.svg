<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Yasmine Salama — Data Science</title>
  <desc id="desc">A dark futuristic header with violet and cyan data points, connections, and a subtle grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B18"/>
      <stop offset="55%" stop-color="#11102A"/>
      <stop offset="100%" stop-color="#071A28"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#91A4C6" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="1000" cy="80" r="200" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1110" cy="300" r="180" fill="#06B6D4" opacity=".07" filter="url(#blur)"/>
  <g fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".8">
    <path d="M760 65 L840 118 L930 88 L1010 150 L1115 106"/>
    <path d="M790 210 L860 165 L930 220 L1010 150 L1100 225 L1160 185"/>
    <path d="M840 118 L860 165 M930 88 L930 220 M1010 150 L1045 285 M1100 225 L1045 285 L970 300"/>
    <path d="M760 65 L790 210 L860 165 M1115 106 L1160 185"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="760" cy="65" r="4"/><circle cx="930" cy="88" r="4"/><circle cx="1115" cy="106" r="4"/>
    <circle cx="860" cy="165" r="5"/><circle cx="1010" cy="150" r="5"/><circle cx="1100" cy="225" r="4"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="840" cy="118" r="4"/><circle cx="930" cy="220" r="4"/><circle cx="1045" cy="285" r="4"/>
    <circle cx="970" cy="300" r="3"/><circle cx="1160" cy="185" r="4"/><circle cx="790" cy="210" r="4"/>
  </g>
  <rect x="58" y="52" width="5" height="245" rx="2.5" fill="url(#line)"/>
  <text x="88" y="94" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="4" fill="#67E8F9">DATA • ENGINEERING • INTELLIGENCE</text>
  <text x="84" y="166" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="750" fill="#F8FAFC">Yasmine Salama</text>
  <text x="88" y="211" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#C4B5FD">Data Science Student</text>
  <text x="88" y="254" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#B7C5D8">Exploring data. Building insight. Learning by creating.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="88" y="279" width="102" height="30" rx="15" fill="#7C3AED" fill-opacity=".22" stroke="#A78BFA" stroke-opacity=".65"/>
    <text x="139" y="298" fill="#DDD6FE" text-anchor="middle">PYTHON</text>
    <rect x="200" y="279" width="82" height="30" rx="15" fill="#0891B2" fill-opacity=".20" stroke="#22D3EE" stroke-opacity=".65"/>
    <text x="241" y="298" fill="#A5F3FC" text-anchor="middle">DATA</text>
    <rect x="292" y="279" width="70" height="30" rx="15" fill="#7C3AED" fill-opacity=".22" stroke="#A78BFA" stroke-opacity=".65"/>
    <text x="327" y="298" fill="#DDD6FE" text-anchor="middle">AI</text>
  </g>
</svg>